 .painel{flex:0 0 calc(100% - 44px);height:100%;scroll-snap-align:start;background:transparent}
 .rolo{transition:background-color .7s ease}
 .painel .quadro{top:calc(var(--bar) + var(--title) + 26px);bottom:calc(var(--title) + 62px);left:var(--m);right:0;transform:none;height:auto;width:auto;aspect-ratio:auto}
 .painel figcaption{top:auto;bottom:calc(var(--title) + 16px);left:var(--m);font-size:var(--small);line-height:1.25}
 .cn{display:inline;margin-left:.6em;font-weight:800}
 .mapa__in{display:flex;flex-direction:column}
 .mapa__t{position:static;display:contents}
 .mapa__t h2{order:0}
 .carta{order:1;margin-top:clamp(16px,3vw,28px);max-height:none}
 .legenda{order:2;margin-top:clamp(14px,3vw,24px)}
 .nota-mapa{order:3}
 .dia__in{display:flex;flex-direction:column}
 .lado,.fotos,.miolo,.linha{display:contents}

 .lado h2{order:0}
 .dia-res{order:0}
 .fotos img{order:var(--o);position:static;opacity:1;width:calc(100% + 2*var(--m));max-width:none;height:auto;aspect-ratio:16/10;margin:1.3rem calc(var(--m)*-1) 1.4rem;transition:none}
 .fotos img:first-child{aspect-ratio:4/3;margin-top:.9rem}
 .custo-d{order:2}
 .brief{order:3}
 .linha>li{order:var(--o)}
 .ctt .tels,.ctt .ress{grid-column:1/13}
 .trans .esq,.slip{grid-column:1/13}

 .seg .reg,.seg .tab{grid-column:1/13}

 .planos ul{grid-template-columns:repeat(2,minmax(0,1fr));gap:0 clamp(40px,7vw,72px)}
 .pend .esq,.pend .lista{grid-column:1/13}
 .pend .esq{position:static}
 .pend .conta{font-size:clamp(3.4rem,14.1vw,8rem)}
 .pend .lista{margin-top:clamp(24px,5vw,40px)}
 .bilhete{display:flex;flex-direction:column-reverse}
 .bilhete .preco{font-size:clamp(5rem,16vw,9rem)}
 .bilhete .stub{border-left:0;border-bottom:6px dotted var(--noite)}

 .rod .notas{grid-template-columns:1fr}
 .nv .seq,.nv .mais{grid-column:1/13}

  @supports(animation-timeline:view()){

   @keyframes abre{from{clip-path:inset(14% 0)}to{clip-path:inset(0)}}
  }
 }
}
@media(min-width:701px) and (max-width:1000px){

 .pin .t1{top:10px}

 .painel .quadro{top:calc(var(--title) + 14px);bottom:calc(var(--title) + 48px)}

 .ind li a{grid-template-columns:1fr}

 .linha time{font-size:var(--body);padding-top:.2em}

 .folha__g{grid-template-columns:1fr;gap:.6rem}
