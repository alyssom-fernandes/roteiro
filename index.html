 .painel .quadro{top:calc(var(--bar) + var(--title) + 26px);bottom:calc(var(--title) + 62px);left:var(--m);right:0;transform:none;height:auto;width:auto;aspect-ratio:auto}
 .painel figcaption{top:auto;bottom:calc(var(--title) + 16px);left:var(--m);font-size:var(--small);line-height:1.25}
 .cn{display:inline;margin-left:.6em;font-weight:800}
 .mapa__in{display:flex;flex-direction:column}
 .mapa__t{position:static;display:contents}
 .mapa__t h2{order:0}
 .carta{order:1;margin-top:clamp(16px,3vw,28px);max-height:none}
 .legenda{order:2;margin-top:clamp(14px,3vw,24px)}
 .nota-mapa{order:3}
 .dia__in{display:flex;flex-direction:column}
 .lado,.fotos,.miolo,.linha{display:contents}
 .lado{position:static}
 .lado h2{order:0}
 .dia-res{order:0}
 .fotos img{order:var(--o);position:static;opacity:1;width:calc(100% + 2*var(--m));max-width:none;height:auto;aspect-ratio:16/10;margin:1.3rem calc(var(--m)*-1) 1.4rem;transition:none}
 .fotos img:first-child{aspect-ratio:4/3;margin-top:.9rem}
 .custo-d{order:2}
 .brief{order:3}
 .linha>li{order:var(--o)}
 .ctt .tels,.ctt .ress{grid-column:1/13}
 .trans .esq,.slip{grid-column:1/13}
 .slip{margin-top:36px;max-width:520px}
 .seg .reg,.seg .tab{grid-column:1/13}
 .seg .tab{margin-top:32px}
 .planos ul{grid-template-columns:repeat(2,minmax(0,1fr));gap:0 clamp(40px,7vw,72px)}
 .pend .esq,.pend .lista{grid-column:1/13}
 .pend .esq{position:static}
 .pend .conta{font-size:clamp(3.4rem,14.1vw,8rem)}
 .pend .lista{margin-top:clamp(24px,5vw,40px)}
 .bilhete{display:flex;flex-direction:column-reverse}
 .bilhete .preco{font-size:clamp(5rem,16vw,9rem)}
 .bilhete .stub{border-left:0;border-bottom:6px dotted var(--noite)}
 .bilhete .n1{left:-14px;top:auto;bottom:-17px}.bilhete .n2{left:auto;right:-14px;top:auto;bottom:-17px}
 .rod .notas{grid-template-columns:1fr}
 .nv .seq,.nv .mais{grid-column:1/13}
 @media(prefers-reduced-motion:no-preference){
  @supports(animation-timeline:view()){
   .fotos img{animation:abre linear both;animation-timeline:view();animation-range:entry 0% entry 55%}
   @keyframes abre{from{clip-path:inset(14% 0)}to{clip-path:inset(0)}}
  }
 }
}
@media(min-width:701px) and (max-width:1000px){
 .fotos img{aspect-ratio:21/9}
 .fotos img:first-child{aspect-ratio:16/9}
 .carta{width:min(100%,620px);align-self:center}
}

@media(max-width:700px){
 html{scroll-padding-top:calc(12px + env(safe-area-inset-top))}
 #topo{scroll-margin-top:-12px}
 .capa__in{padding-bottom:calc(var(--bar) + env(safe-area-inset-bottom) + var(--tela)*.135)}
 .capa .desce{bottom:calc(var(--bar) + env(safe-area-inset-bottom) + var(--tela)*.012)}
 @media(max-height:780px){
  .capa__in{padding-bottom:calc(var(--bar) + env(safe-area-inset-bottom) + var(--tela)*.1)}
  .capa .mono{font-size:min(30vw,calc(var(--tela)*.16))}
  .capa .desce{bottom:calc(var(--bar) + env(safe-area-inset-bottom) + 2px);gap:0}
  .capa .desce svg{display:none}
 }
 body{padding-bottom:calc(var(--bar) + env(safe-area-inset-bottom))}
 body::before{content:"";position:fixed;inset:0 0 auto 0;height:env(safe-area-inset-top);background:var(--noite);z-index:11}
 .na-capa body::before{display:none}
 .bar{inset:auto 0 0 0;height:calc(var(--bar) + env(safe-area-inset-bottom));padding:0 6px env(safe-area-inset-bottom);gap:2px}
 .bar .marca{display:none}
 .bar .dia-l{flex:1 1 0;justify-content:center;padding-inline:0;min-height:48px}
 .bar .u{display:flex;flex-direction:column;align-items:center;line-height:1.1}
 .bar .s{font-size:.875rem}
 .bar .n{font-size:1.0625rem;font-weight:800}
 .bar .dia-l[aria-current=true]{background:var(--ouro);color:var(--noite)}
 .bar .dia-l[aria-current=true] .u{color:inherit;text-decoration:none}
 .bar .dia-l.hoje .n{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:.16em}
 .bar .m{padding-inline:6px;font-size:.875rem}
 .bar .agora-b{padding-inline:9px;min-height:48px;font-size:.875rem}
 .prox{bottom:calc(var(--bar) + env(safe-area-inset-bottom))}
 .tem-prox{padding-bottom:calc(var(--bar) + 56px + env(safe-area-inset-bottom))}
 .run{height:calc(var(--tela) - var(--bar) - env(safe-area-inset-bottom))}
 .pin .t1{top:10px}
 .pin .t2{bottom:0}
 .pin .quando{top:18px;font-size:var(--small);max-width:46vw}
 .painel .quadro{top:calc(var(--title) + 14px);bottom:calc(var(--title) + 48px)}
 .painel figcaption{bottom:calc(var(--title) + 6px)}
 .ind li a{grid-template-columns:1fr}
 .ind .nome::after{content:" ›";font-weight:500}
 .ind .res{font-size:var(--body);margin-top:.15em}
 .planos ul{grid-template-columns:1fr}
 .linha>li{grid-template-columns:4.1rem minmax(0,1fr);gap:0 .7rem;padding:.7rem .7rem;margin-inline:-.7rem;scroll-margin-top:calc(8px + env(safe-area-inset-top))}
 .linha time{font-size:var(--body);padding-top:.2em}
 .linha>li.pds{margin-inline:calc(var(--m)*-1);padding-inline:var(--m)}
 .pds__l{grid-template-columns:4.1rem minmax(0,1fr)}
 .pend li{scroll-margin-top:calc(8px + env(safe-area-inset-top))}
 .brief,.linha>li.is-next,.linha>li.cuidado,.pend li.is-next{margin-inline:calc(var(--m)*-1);padding-inline:var(--m)}
 .planos ul{gap:0}
 .fotos img:not(:first-child){aspect-ratio:2/1}
 .dia+.dia::before{height:clamp(96px,14vh,130px);margin-bottom:28px}
 .dia+.dia{scroll-margin-top:calc(-1*(clamp(96px,14vh,130px) + 28px) + 8px)}
 .dia{padding-bottom:40px}
 .bilhete .preco{font-size:20vw}
 .bilhete dl{grid-template-columns:1fr}
 .fim{height:calc(var(--tela) - var(--bar))}
 .fim p{top:calc(18px + env(safe-area-inset-top))}
 .fim b{font-size:min(27vw,17svh)}
 .folha__g{grid-template-columns:1fr;gap:.6rem}
 .ceu{margin-inline:calc(var(--m)*-1)}
 .ceu a{padding-inline:var(--m);min-height:clamp(54px,9.4vh,84px)}
 dialog{padding-top:16px}
 .fecha{top:auto;right:6px;bottom:calc(4px + env(safe-area-inset-bottom));min-height:48px}
 .arte{padding:64px var(--m) calc(var(--m) + env(safe-area-inset-bottom))}
 .arte .fecha{top:8px;right:8px;bottom:auto;min-height:44px}
}
