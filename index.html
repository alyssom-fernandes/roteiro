<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Roteiro Rio</title><meta name="theme-color" content="#0e2130"><meta name="robots" content="noindex,nofollow"><meta name="description" content="Roteiro de viagem privado."><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icone-180.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Roteiro Rio"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230e2130'/%3E%3Ccircle cx='16' cy='18' r='9' fill='%23f7cd80'/%3E%3Crect y='18' width='32' height='14' fill='%230e2130'/%3E%3C/svg%3E"><script>document.documentElement.classList.add("js")</script><style>@font-face{font-family:"Cabinet Grotesk";font-style:normal;font-weight:400;font-display:swap;src:url(fonte/cabinet-400.woff2) format("woff2")}@font-face{font-family:"Cabinet Grotesk";font-style:normal;font-weight:500;font-display:swap;src:url(fonte/cabinet-500.woff2) format("woff2")}@font-face{font-family:"Cabinet Grotesk";font-style:normal;font-weight:800;font-display:swap;src:url(fonte/cabinet-800.woff2) format("woff2")}
:root{
 --noite:#0e2130;--mar:#1d4258;--pedra:#efeeea;--ouro:#f7cd80;--surface:#16303f;--muted:#a9b7c0;
 --small:clamp(.875rem,.85rem + .1vw,.9375rem);
 --body:clamp(1.0625rem,1rem + .25vw,1.1875rem);
 --lead:clamp(1.25rem,1.1rem + .7vw,1.625rem);
 --head:clamp(2.5rem,1.2rem + 5vw,5.5rem);
 --title:clamp(5.5rem,12.4vw,13.5rem);
 --m:clamp(16px,2.2vw,32px);--bar:56px;
 --out:cubic-bezier(.22,1,.36,1);
 --tela:100vh;
}
@supports(height:100svh){:root{--tela:100svh}}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--bar) + 12px);-webkit-text-size-adjust:100%;color-scheme:dark}
html:has(dialog[open]){overflow:hidden}
body{margin:0;background:var(--noite);color:var(--pedra);font-family:"Cabinet Grotesk",ui-sans-serif,system-ui,"Segoe UI",Roboto,Arial,sans-serif;font-size:var(--body);line-height:1.5;font-weight:400;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-underline-offset:.18em;text-decoration-thickness:.08em}
h1,h2,h3,p,ul,ol,dl,dd,figure{margin:0;padding:0}
ul,ol{list-style:none}
h1,h2{font-weight:800;letter-spacing:-.035em;line-height:.92;text-wrap:balance}
h2{font-size:var(--head)}
p{text-wrap:pretty}
img{display:block;max-width:100%}
:focus-visible{outline:3px solid var(--ouro);outline-offset:3px}
.dia :focus-visible,.seg :focus-visible,.pend :focus-visible{outline-color:currentColor}
::selection{background:var(--ouro);color:var(--noite)}

/* barra */
.bar{position:fixed;inset:0 0 auto 0;height:var(--bar);z-index:10;display:flex;align-items:center;gap:clamp(4px,1.4vw,22px);padding-inline:var(--m);background:var(--noite);color:var(--pedra);font-weight:500}
.bar a{text-decoration:none;min-height:44px;display:inline-flex;align-items:center;padding-inline:6px;transition:color .18s ease,background-color .18s ease}
.bar .marca{font-weight:800;letter-spacing:-.02em;margin-right:auto}
.bar .s{color:var(--muted)}
.bar .dia-l[aria-current=true] .u{color:var(--ouro);text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:.3em}
.bar .dia-l[aria-current=true] .s{color:inherit}
.bar .agora-b{background:var(--ouro);color:var(--noite);padding-inline:18px;font-weight:800;transition:transform .14s var(--out),background-color .18s ease}
.bar .agora-b:active{transform:scale(.97)}
@media(hover:hover) and (pointer:fine){.bar a:not(.agora-b):hover{color:var(--ouro)}.bar .agora-b:hover{background:var(--pedra)}}

/* abertura: a hora fica, os lugares passam */
.run{position:relative}
.pinwrap{position:absolute;inset:0;z-index:2;pointer-events:none}
.pin{position:sticky;top:0;height:var(--tela)}
.pin h1{font-size:var(--title);letter-spacing:-.045em;line-height:.86}
.pin .t1,.pin .t2{position:absolute;display:block}
.pin .t1{left:var(--m);top:calc(var(--bar) + 18px)}
.pin .t2{right:var(--m);bottom:calc(var(--m) - .04em)}
.pin .quando{position:absolute;right:var(--m);top:calc(var(--bar) + 26px);text-align:right;font-size:var(--lead);font-weight:500;line-height:1.2}
.pin .tese{position:absolute;left:var(--m);bottom:var(--m);max-width:27ch;font-weight:500}
.painel{position:relative;height:var(--tela);background:var(--g);overflow:hidden}
.painel .quadro{position:absolute;top:var(--bar);bottom:0;left:50%;transform:translateX(-50%);height:calc(var(--tela) - var(--bar));aspect-ratio:2/3;overflow:hidden;background:var(--surface)}
.painel img{width:100%;height:100%;object-fit:cover}
.painel figcaption{position:absolute;left:var(--m);top:46%;font-size:var(--lead);line-height:1.2;font-weight:500}
.painel figcaption b{display:block;font-weight:800}

/* índice */
.ind{padding:clamp(72px,11vw,170px) var(--m) clamp(64px,9vw,140px);background:var(--noite)}
.ind h2{margin-bottom:clamp(32px,4vw,64px)}
.ind li a{display:grid;grid-template-columns:minmax(0,4.5fr) minmax(0,5fr) minmax(0,2.5fr);gap:0 var(--m);align-items:baseline;text-decoration:none;padding-block:clamp(10px,1.3vw,20px);transition:color .18s ease}
.ind .nome{font-size:var(--head);font-weight:800;letter-spacing:-.035em;line-height:1}
.ind .res,.ind .sol{font-size:var(--lead);line-height:1.2}
.ind .sol{text-align:right;font-variant-numeric:tabular-nums}
@media(hover:hover) and (pointer:fine){.ind li a:hover{color:var(--ouro)}}

/* dias */
.dia{background:var(--g);color:var(--i);padding:clamp(64px,8vw,130px) var(--m)}
.dia__in{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:0 var(--m)}
.lado{grid-column:1/6;position:sticky;top:calc(var(--bar) + 20px);align-self:start}
.lado h2 small{display:block;font-size:var(--lead);font-weight:500;letter-spacing:0;line-height:1.2;margin-top:.5em}
.fotos{position:relative;margin-top:clamp(18px,2vw,28px);aspect-ratio:4/5;max-height:calc(var(--tela) - var(--bar) - 220px);width:100%;overflow:hidden;background:var(--tile)}
.fotos img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s ease}
.fotos img.on{opacity:1}
.miolo{grid-column:7/13;min-width:0}
.custo-d{font-weight:500;margin-bottom:clamp(18px,2vw,30px)}
.linha li{display:grid;grid-template-columns:5.4rem minmax(0,1fr);gap:0 1rem;padding:.8rem .9rem;margin-inline:-.9rem;scroll-margin-top:calc(var(--bar) + 16px)}
.linha time,.linha h3{font-size:var(--lead);font-weight:800;line-height:1.15;letter-spacing:-.015em}
.linha time{font-variant-numeric:tabular-nums}
.linha h3{margin:0}
.meta{display:flex;flex-wrap:wrap;gap:0 1em;font-size:var(--small);font-weight:500;margin-top:.25em}
.meta a{font-weight:800;text-decoration:underline;padding-block:.2em;margin-block:-.2em}
.linha .nota{margin-top:.35em;max-width:54ch}
.linha .alt{margin-top:.35em;max-width:54ch}
.linha .alt b{font-weight:800}
.linha .alerta{background:var(--tile)}
.is-next,.linha .is-next{background:var(--i);color:var(--g)}
.pb{margin-top:.25em}
.pb summary{display:inline-flex;align-items:center;gap:.4em;min-height:34px;font-size:var(--small);font-weight:800;cursor:pointer;list-style:none;text-decoration:underline;text-underline-offset:.18em}
.pb summary::-webkit-details-marker{display:none}
.pb summary::after{content:"+";font-size:1.3em;line-height:1;display:inline-block;width:.7em;text-align:center;transition:transform .2s var(--out)}
.pb[open] summary::after{content:"–"}
.pb:not([open]) .pb__c{display:none}
.pb__c{display:grid;gap:.8rem;padding:.75rem .85rem;background:var(--tile);margin-top:.15em}
.alerta .pb__c{background:var(--g)}
.is-next .pb__c{background:transparent;padding-inline:0}
.pb .q{font-size:var(--small);font-weight:500}
.pb h4{margin:0;font-size:var(--body);font-weight:800;line-height:1.2}
.pb .t{margin-top:.2em;max-width:54ch}
.chuva{margin-top:clamp(20px,2.4vw,36px);max-width:54ch;font-weight:500}
.chuva b{font-weight:800}

/* planos B */
.planos{padding:clamp(80px,10vw,170px) var(--m);background:var(--noite)}
.planos ul{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(32px,3.6vw,56px) var(--m);margin-top:clamp(40px,5vw,76px)}
.planos h3{font-size:var(--lead);font-weight:800;line-height:1.15;letter-spacing:-.015em;margin:0 0 .4em}

/* só você */
.nv{padding:clamp(80px,10vw,170px) var(--m);background:var(--ouro);color:var(--noite);color-scheme:light}
.nv__in{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:clamp(32px,4vw,56px) var(--m);margin-top:clamp(40px,5vw,76px)}
.nv h3{font-size:var(--lead);font-weight:800;line-height:1.2;margin:0 0 .6em}
.nv .seq{grid-column:1/6}
.nv .seq li{display:grid;grid-template-columns:7.2rem minmax(0,1fr);gap:0 .9rem;padding-block:.4rem}
.nv .seq b{font-weight:800;font-variant-numeric:tabular-nums}
.nv .mais{grid-column:7/13;display:grid;gap:clamp(28px,3vw,44px)}
.nv dt{font-weight:800;margin-top:.7em}
.nv dt:first-child{margin-top:0}
.nv .mais li{padding-bottom:.5em;max-width:58ch}

/* foto cheia */
.cheia{height:min(calc(var(--tela)*.82),56vw);min-height:300px;overflow:hidden;background:var(--mar)}
.cheia img{width:100%;height:100%;object-fit:cover;object-position:50% 72%}

/* transporte */
.trans{padding:clamp(80px,10vw,170px) var(--m);background:var(--mar);color:var(--pedra)}
.trans__in{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:0 var(--m)}
.trans .esq{grid-column:1/6}
.trans .esq>p{margin-top:1em;max-width:34ch}
.trans dl{margin-top:clamp(28px,3vw,44px)}
.trans dt{font-size:var(--lead);font-weight:800;line-height:1.2;margin-top:1.05em}
.trans dd{max-width:42ch}
.slip{grid-column:7/12;background:var(--pedra);color:var(--noite);padding:30px 28px 48px;align-self:start;clip-path:polygon(0 0,100% 0,100.00% calc(100% - 10px),98.08% 100%,96.15% calc(100% - 10px),94.23% 100%,92.31% calc(100% - 10px),90.38% 100%,88.46% calc(100% - 10px),86.54% 100%,84.62% calc(100% - 10px),82.69% 100%,80.77% calc(100% - 10px),78.85% 100%,76.92% calc(100% - 10px),75.00% 100%,73.08% calc(100% - 10px),71.15% 100%,69.23% calc(100% - 10px),67.31% 100%,65.38% calc(100% - 10px),63.46% 100%,61.54% calc(100% - 10px),59.62% 100%,57.69% calc(100% - 10px),55.77% 100%,53.85% calc(100% - 10px),51.92% 100%,50.00% calc(100% - 10px),48.08% 100%,46.15% calc(100% - 10px),44.23% 100%,42.31% calc(100% - 10px),40.38% 100%,38.46% calc(100% - 10px),36.54% 100%,34.62% calc(100% - 10px),32.69% 100%,30.77% calc(100% - 10px),28.85% 100%,26.92% calc(100% - 10px),25.00% 100%,23.08% calc(100% - 10px),21.15% 100%,19.23% calc(100% - 10px),17.31% 100%,15.38% calc(100% - 10px),13.46% 100%,11.54% calc(100% - 10px),9.62% 100%,7.69% calc(100% - 10px),5.77% 100%,3.85% calc(100% - 10px),1.92% 100%,0.00% calc(100% - 10px))}
.slip h3{font-size:var(--body);font-weight:800;margin:26px 0 8px}
.slip h3:first-child{margin-top:0}
.slip .l{display:flex;align-items:baseline;gap:8px;font-size:var(--body);font-variant-numeric:tabular-nums}
.slip .l span:last-child{white-space:nowrap}
.slip.sem-total{padding-bottom:40px}
.slip .l i{flex:1;min-width:16px;border-bottom:3px dotted currentColor;transform:translateY(-.22em);opacity:.55}
.slip .fim-l{display:flex;justify-content:space-between;align-items:center;gap:1rem;background:var(--noite);color:var(--pedra);margin:26px -28px 0;padding:0 28px;min-height:48px;font-weight:800;font-variant-numeric:tabular-nums}

/* segurança */
.seg{padding:clamp(80px,10vw,170px) var(--m);background:var(--pedra);color:var(--noite);color-scheme:light}
.seg__in{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:0 var(--m);margin-top:clamp(44px,6vw,96px)}
.seg .reg{grid-column:1/6}
.seg .reg li{padding-bottom:1.05em;max-width:50ch}
.seg .reg b{display:block;font-size:var(--lead);line-height:1.2;font-weight:800}
.seg .tab{grid-column:7/13;align-self:start}
.seg table{border-collapse:collapse;width:100%;font-size:var(--body)}
.seg caption{text-align:left;font-size:var(--lead);font-weight:800;padding-bottom:.6em}
.seg th,.seg td{text-align:left;vertical-align:top;padding:.4em 0;font-weight:400}
.seg th{font-weight:800;width:42%;padding-right:1em}
.tels{margin-top:clamp(32px,4vw,56px)}
.tels h3{font-size:var(--lead);font-weight:800;line-height:1.2;margin:0 0 .5em}
.tels ul{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 var(--m)}
.tels a{display:flex;justify-content:space-between;align-items:center;gap:1em;min-height:44px;text-decoration:none}
.tels a span:last-child{font-weight:800;font-variant-numeric:tabular-nums;text-decoration:underline;white-space:nowrap}

/* bilhete */
.custos{padding:clamp(80px,10vw,170px) var(--m);background:var(--noite)}
.bilhete{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);background:var(--ouro);color:var(--noite)}
.bilhete .princ{padding:clamp(24px,3vw,44px)}
.bilhete dl{display:grid;grid-template-columns:1fr 1fr;gap:.35em 2.2em;margin-top:clamp(24px,3vw,44px)}
.bilhete dl div{display:flex;justify-content:space-between;gap:1em;font-size:var(--body)}
.bilhete dd{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.bilhete .stub{position:relative;border-left:6px dotted var(--noite);display:flex;flex-direction:column;justify-content:space-between;gap:1.2em;padding:clamp(20px,2.4vw,32px) clamp(16px,1.8vw,26px)}
.bilhete .nt{position:absolute;width:28px;height:28px;border-radius:50%;background:var(--noite);left:-17px}
.bilhete .n1{top:-14px}.bilhete .n2{bottom:-14px}
.bilhete .preco{font-size:9.4vw;font-weight:800;line-height:.95;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.bilhete .preco span{display:block;white-space:nowrap}
.bilhete .sem{font-weight:500;max-width:32ch}

/* pendências */
.pend{--g:var(--pedra);--i:var(--noite);padding:clamp(80px,10vw,170px) var(--m);background:var(--pedra);color:var(--noite);color-scheme:light}
.pend__in{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:0 var(--m)}
.pend .esq{grid-column:1/6;display:flex;flex-direction:column;justify-content:space-between;gap:1.2em}
.pend .conta{font-size:9.4vw;font-weight:800;line-height:.95;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.pend .como{font-size:var(--lead);font-weight:500;line-height:1.2;margin-top:.5em;max-width:24ch}
.pend ul{grid-column:7/13}
.pend li{padding-inline:.7rem;margin-inline:-.7rem;scroll-margin-top:calc(var(--bar) + 16px)}
.pend label{position:relative;display:grid;grid-template-columns:26px minmax(0,1fr);gap:0 .8rem;align-items:start;min-height:44px;padding-block:.55rem;cursor:pointer}
.pend input{position:absolute;left:0;top:.55rem;width:26px;height:26px;margin:0;opacity:0;cursor:pointer}
.pend .cx{position:relative;display:block;width:26px;height:26px;border:2px solid currentColor;transition:background-color .15s ease,transform .14s var(--out)}
.pend input:active+.cx{transform:scale(.9)}
.pend input:checked+.cx{background:currentColor}
.pend input:checked+.cx::after{content:"";position:absolute;left:6px;top:1px;width:8px;height:15px;border-right:3px solid var(--pedra);border-bottom:3px solid var(--pedra);transform:rotate(42deg)}
.pend input:focus-visible+.cx{outline:3px solid var(--mar);outline-offset:3px}
.pend b{font-weight:500;line-height:1.3}
.pend input:checked~b{text-decoration:line-through}
.pend .extra{display:flex;flex-wrap:wrap;gap:0 1em;font-size:var(--small);font-weight:800;margin:-.3rem 0 .45rem calc(26px + .8rem)}
.pend .extra a{text-decoration:underline;padding-block:.2em}

/* fim */
.fim{position:relative;height:var(--tela);min-height:520px;overflow:hidden;background:var(--mar);color:var(--pedra)}
.fim img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 45%}
.fim p{position:absolute;left:var(--m);top:calc(var(--bar) + 20px);font-weight:800;letter-spacing:-.04em;line-height:.9}
.fim span,.fim b{display:block;font-weight:800}
.fim span{font-size:var(--head)}
.fim b{font-size:var(--title)}

/* rodapé */
.rod{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:clamp(32px,4vw,56px) var(--m);background:var(--noite);color:var(--pedra);padding:clamp(56px,6vw,96px) var(--m) calc(var(--m) + 8px)}
.rod nav{grid-column:1/6}
.rod nav ul{columns:2;column-gap:var(--m)}
.rod nav a{display:inline-block;font-size:var(--lead);font-weight:800;line-height:1.15;text-decoration:none;padding-block:.28em;transition:transform .18s var(--out),color .18s ease}
@media(hover:hover) and (pointer:fine){.rod nav a:hover{transform:translateX(10px);color:var(--ouro)}}
.rod .notas{grid-column:7/13;font-size:var(--small);display:grid;gap:clamp(24px,3vw,40px)}
.rod h3{font-size:var(--body);font-weight:800;margin:0 0 .4em}
.rod .notas p{margin-bottom:.45em;max-width:60ch}

/* menu */
dialog{position:fixed;inset:0;width:100%;height:100%;max-width:none;max-height:none;margin:0;padding:calc(var(--bar) + 12px) var(--m) calc(var(--bar) + 20px);border:0;background:var(--noite);color:var(--pedra);overflow:auto}
dialog::backdrop{background:var(--noite)}
.folha ul{columns:2;column-gap:var(--m)}
.folha a{display:inline-block;font-size:clamp(1.75rem,1.1rem + 3vw,4rem);font-weight:800;letter-spacing:-.03em;line-height:1.05;text-decoration:none;padding-block:.2em}
@media(hover:hover) and (pointer:fine){.folha a:hover{color:var(--ouro)}}
.fecha{position:fixed;right:var(--m);top:6px;min-height:44px;padding-inline:18px;border:0;background:var(--ouro);color:var(--noite);font:inherit;font-weight:800;cursor:pointer}

/* movimento */
@media(prefers-reduced-motion:no-preference){
 .js [data-r]{opacity:0;transform:translateY(22px);transition:opacity .7s var(--out),transform .85s var(--out);transition-delay:calc(var(--n,0)*70ms)}
 .js [data-r].in{opacity:1;transform:none}
 .js .t1 span,.js .t2 span{display:block;transform:translateY(106%);animation:sobe .95s var(--out) forwards}
 .js .t2 span{animation-delay:.12s}
 .t1,.t2{overflow:hidden;padding-bottom:.06em}
 @keyframes sobe{to{transform:none}}
 @supports(animation-timeline:view()){
  .painel img,.cheia img,.fim img{animation:deriva linear both;animation-timeline:view();animation-range:entry 0% exit 100%}
  @keyframes deriva{from{transform:scale(1.08) translateY(-2.5%)}to{transform:scale(1.08) translateY(2.5%)}}
 }
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

/* tratamento único das fotos dos dias */
.fotos img{filter:saturate(.9) sepia(.08) contrast(1.03)}

@media(max-width:1100px){
 .ind li a{grid-template-columns:minmax(0,5fr) minmax(0,7fr)}
 .ind .sol{display:none}
}

/* telas médias */
@media(max-width:1000px){
 :root{--title:min(27vw,15.5svh)}
 .run{height:var(--tela)}
 .pin{height:100%}
 .pin .quando{top:calc(var(--bar) + 20px)}
 .pin .tese{display:none}
 .rolo{display:flex;height:100%;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;background:var(--noite)}
 .rolo::-webkit-scrollbar{display:none}
 .rolo::after{content:"";flex:0 0 var(--m)}
 .painel{flex:0 0 calc(100% - 44px);height:100%;scroll-snap-align:start;background:none}
 .painel .quadro{top:calc(var(--bar) + var(--title) + 26px);bottom:calc(var(--title) + 62px);left:var(--m);right:0;transform:none;height:auto;width:auto;aspect-ratio:auto}
 .painel figcaption{top:auto;bottom:calc(var(--title) + 16px);left:var(--m);font-size:var(--small);line-height:1.25}
 .dia__in{display:flex;flex-direction:column}
 .lado,.fotos,.miolo,.linha{display:contents}
 .lado{position:static}
 .lado h2{order:0}
 .fotos img{order:var(--o);position:static;opacity:1;width:calc(100% + 2*var(--m));max-width:none;height:auto;aspect-ratio:16/10;margin:1.3rem calc(var(--m)*-1) 1.4rem;transition:none}
 .custo-d{order:2}
 .linha li{order:var(--o)}
 .chuva{order:999}
 .trans .esq,.slip{grid-column:1/13}
 .slip{margin-top:36px;max-width:520px}
 .seg .reg,.seg .tab{grid-column:1/13}
 .seg .tab{margin-top:32px}
 .planos ul{grid-template-columns:repeat(2,minmax(0,1fr))}
 .pend .esq,.pend ul{grid-column:1/13}
 .pend .conta{font-size:clamp(4rem,22vw,9rem)}
 .pend ul{margin-top:clamp(24px,5vw,40px)}
 .bilhete{display:flex;flex-direction:column-reverse}
 .bilhete .preco{font-size:clamp(5rem,16vw,9rem)}
 .bilhete .stub{border-left:0;border-bottom:6px dotted var(--noite)}
 .bilhete .n1{left:-14px;top:auto;bottom:-17px}.bilhete .n2{left:auto;right:-14px;top:auto;bottom:-17px}
 .rod nav,.rod .notas{grid-column:1/13}
 .nv .seq,.nv .mais{grid-column:1/13}
}

/* celular */
@media(max-width:700px){
 html{scroll-padding-top:12px}
 body{padding-bottom:calc(var(--bar) + env(safe-area-inset-bottom))}
 .bar{inset:auto 0 0 0;height:calc(var(--bar) + env(safe-area-inset-bottom));padding:0 6px env(safe-area-inset-bottom);gap:2px}
 .bar .marca{display:none}
 .bar .dia-l{flex:1 1 0;justify-content:center;padding-inline:0;min-height:48px}
 .bar .u{display:flex;flex-direction:column;align-items:center;line-height:1.1}
 .bar .s{font-size:.8125rem}
 .bar .n{font-size:1.0625rem;font-weight:800}
 .bar .dia-l[aria-current=true]{background:var(--ouro);color:var(--noite)}
 .bar .dia-l[aria-current=true] .u{color:inherit;text-decoration:none}
 .bar .m{padding-inline:8px}
 .bar .agora-b{padding-inline:12px;white-space:nowrap;min-height:48px}
 .run{height:calc(var(--tela) - var(--bar) - env(safe-area-inset-bottom))}
 .pin .t1{top:10px}
 .pin .t2{bottom:0}
 .pin .quando{top:18px;font-size:var(--small);font-weight:800;max-width:42vw}
 .painel .quadro{top:calc(var(--title) + 14px);bottom:calc(var(--title) + 48px)}
 .painel figcaption{bottom:calc(var(--title) + 6px)}
 .ind li a{grid-template-columns:1fr}
 .ind .res{font-size:var(--body);margin-top:.15em}
 .planos ul{grid-template-columns:1fr}
 .linha li{grid-template-columns:4.1rem minmax(0,1fr);gap:0 .7rem;padding:.7rem .7rem;margin-inline:-.7rem}
 .linha time{font-size:var(--body);padding-top:.2em}
 .cheia{height:68vw}
 .cheia img{object-position:30% 80%}
 .tels ul{grid-template-columns:1fr}
 .bilhete .preco{font-size:22vw}
 .bilhete dl{grid-template-columns:1fr}
 .fim{height:calc(var(--tela) - var(--bar))}
 .fim p{top:18px}
 .fim b{font-size:min(27vw,17svh)}
 .rod nav ul{columns:1}
 .folha ul{columns:1}
 dialog{padding-top:32px}
 .fecha{top:auto;right:6px;bottom:calc(4px + env(safe-area-inset-bottom));min-height:48px}
}

/* entrada */
#entrada{position:fixed;inset:0;z-index:30;display:flex;padding:calc(var(--m) + 8px) var(--m);background:var(--mar);color:var(--pedra);overflow:auto}

#entrada img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 45%}
#entrada form{position:relative;width:min(100%,420px);display:grid;align-content:start;gap:.55rem}
#entrada h1{font-size:var(--title);letter-spacing:-.045em;line-height:.86;margin:0 0 .28em}

#erro{min-height:1.5em;font-weight:800}
.folha .sair{min-height:44px;margin-top:.8em;padding:0;border:0;background:none;color:var(--muted);font:inherit;text-decoration:underline;cursor:pointer}

(function(){

 var C=JSON.parse(d.getElementById('cofre').textContent),ATE='rr-nos',SES='rr-eu',modo=null;
 function bin(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
 function txt(u){var s='';for(var i=0;i<u.length;i++){s+=String.fromCharCode(u[i])}return btoa(s)}
 function ler(a,k){try{return a.getItem(k)}catch(e){return null}}
 function por(a,k,v){try{a.setItem(k,v)}catch(e){}}
 function tira(a,k){try{a.removeItem(k)}catch(e){}}
 function chave(s){
  return crypto.subtle.importKey('raw',new TextEncoder().encode(s.normalize('NFKC').trim().toLowerCase()),'PBKDF2',false,['deriveBits']).then(function(k){
   return crypto.subtle.deriveBits({name:'PBKDF2',salt:bin(C.sal),iterations:C.it,hash:'SHA-256'},k,256)
  }).then(function(b){return new Uint8Array(b)});
 }
 function abre(k,item){
  return crypto.subtle.importKey('raw',k,'AES-GCM',false,['decrypt']).then(function(c){
   return crypto.subtle.decrypt({name:'AES-GCM',iv:bin(item.iv)},c,bin(item.ct))
  }).then(function(b){return new TextDecoder().decode(b)});
 }

  chave(campo.value).then(function(k){
   return abre(k,C.a).then(function(){por(localStorage,ATE,txt(k));location.reload()},function(){

   })
  }).catch(function(){erro.textContent='Senha incorreta.';campo.select()});
 });

})();
